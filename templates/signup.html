<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LearnPath AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(51, 51, 51, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 180, 0, 0.2);
            position: relative;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .logo img {
            height: 35px;
            filter: drop-shadow(0 0 10px rgba(255, 180, 0, 0.5));
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6a00, #ffb400, #ff6a00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #c0c0c0;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff6a00;
            font-size: 1.2rem;
        }

        .toggle-password {
            left: auto !important;
            right: 15px;
            cursor: pointer;
            pointer-events: auto;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"].password-field {
            width: 100%;
            padding: 15px 45px 15px 45px;
            border: 2px solid rgba(255, 180, 0, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"].password-field:focus {
            border-color: #ff6a00;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.3);
        }

        input::placeholder {
            color: #aaa;
        }

        /* Override the browser's autofill styling (normally forces a white
           background) so autofilled fields still match the dark theme. */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px rgba(30, 30, 40, 0.9) inset;
            -webkit-text-fill-color: #fff;
            caret-color: #fff;
            transition: background-color 5000s ease-in-out 0s;
        }

        .submit-button {
            background: linear-gradient(135deg, #ff6a00, #ffb400);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }

        .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 106, 0, 0.5);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #ff8a80;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .switch-link {
            margin-top: 20px;
            font-size: 0.95rem;
            color: #c0c0c0;
        }

        .switch-link a {
            color: #ffb400;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <img src="/static/astronaut.png" alt="Learning Path Generator" />
            <span>LearnPath AI</span>
        </a>
    </header>

    <canvas id="space"></canvas>

    <div class="content">
        <div class="form-container">
            <h1>Join LearnPath AI</h1>
            <p class="subtitle">Create an account to save your learning path across visits</p>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/signup">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="signupPassword" class="password-field" placeholder="Choose a password" required>
                    <i class="fas fa-eye toggle-password" id="signupPasswordToggle" onclick="togglePasswordVisibility('signupPassword', 'signupPasswordToggle')"></i>
                </div>
                <button type="submit" class="submit-button">
                    <i class="fas fa-rocket"></i> Sign Up
                </button>
            </form>

            <p class="switch-link">Already have an account? <a href="/login">Log in</a></p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            icon.classList.toggle('fa-eye', showing);
            icon.classList.toggle('fa-eye-slash', !showing);
        }

        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = Array.from({ length: 200 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2.5 + 0.5,
            speed: Math.random() * 0.8 + 0.1,
            opacity: Math.random(),
            twinkleSpeed: Math.random() * 0.02 + 0.01
        }));

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.save();
                ctx.globalAlpha = star.opacity;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = -star.radius;
                    star.x = Math.random() * canvas.width;
                }
                star.opacity += star.twinkleSpeed;
                if (star.opacity >= 1 || star.opacity <= 0.1) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
