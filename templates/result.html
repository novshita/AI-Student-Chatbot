<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Path Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: black;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            position: relative;
            z-index: 10;
        }

        /* Logo styling */
        .logo img {
            height: 30px;
        }

        /* Navigation Bar styling */
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Add responsiveness if needed */
        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                align-items: center;
            }

            nav ul li {
                margin-bottom: 10px;
            }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .modules-section {
            background: rgba(42, 36, 56, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(100, 92, 187, 0.5);
            backdrop-filter: blur(15px);
            max-width: 800px;
            width: 100%;
        }

        .modules-section h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #F5EAEA;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6a00, #ffb400);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modules-section p {
            text-align: center;
            color: #F5EAEA;
            margin-bottom: 30px;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .module {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 5px;
            transition: all 0.3s ease;
        }

        .module:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 106, 0, 0.3);
        }

        .module button.module-button {
            padding: 15px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6a00, #ffb400);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            text-align: left;
            flex-grow: 1;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .module button.module-button:hover {
            background: linear-gradient(135deg, #ffb400, #ff6a00);
        }

        .go-button {
            width: 50px;
            height: 50px;
            margin-left: 10px;
            background: linear-gradient(135deg, #ff6a00, #ffb400);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .go-button:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #ffb400, #ff6a00);
            box-shadow: 0 8px 15px rgba(255, 106, 0, 0.4);
        }

        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6a00, #ffb400);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .chat-button:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ffb400, #ff6a00);
            box-shadow: 0 10px 25px rgba(255, 106, 0, 0.4);
        }

        @media (max-width: 768px) {
            .modules-section {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .modules-section h1 {
                font-size: 2rem;
            }
            
            .modules-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .module button.module-button {
                font-size: 1rem;
                padding: 12px 15px;
            }
            
            .go-button {
                width: 45px;
                height: 45px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- Logo that acts as home button -->
        <a href="/" class="logo">
            <img src="static/astronaut.png" alt="Website Logo" />
        </a>

        <!-- Navigation Bar -->
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Contact</a></li>
            </ul>
        </nav>
    </header>
    
    <canvas id="space"></canvas>
    
    <div class="main-container">
        <div class="modules-section">
            <h1>Learning Path Modules</h1>
            <p>Choose a module to begin your learning journey</p>
            
            <div class="modules-grid" id="modulesGrid">
                {% for module_name, subtopics in modules.items() %}
                {% if module_name not in seen_modules %}
                <div class="module">
                    <button class="module-button">{{ module_name }}</button>
                    <button class="go-button" onclick="window.location.href='/{{ loop.index }}'">GO</button>
                </div>
                {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>
    
    <button class="chat-button" onclick="window.location.href='/c'">💬</button>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = Array.from({ length: 200 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.1
        }));

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });
            requestAnimationFrame(draw);
        }

        draw();

        function updateModules(modules) {
            const modulesGrid = document.getElementById('modulesGrid');
            modulesGrid.innerHTML = '';
            
            Object.entries(modules).forEach(([moduleName, subtopics], index) => {
                const moduleDiv = document.createElement('div');
                moduleDiv.className = 'module';
                
                moduleDiv.innerHTML = `
                    <button class="module-button">${moduleName}</button>
                    <button class="go-button" onclick="window.location.href='/${index + 1}'">GO</button>
                `;
                
                modulesGrid.appendChild(moduleDiv);
            });
        }
    </script>
</body>
</html>
