<!-- Floating chat widget: include this partial on any page that already has a
     button calling openChatWidget() (e.g. class="chat-button"). -->
<div id="chatWidgetPanel" class="chat-widget-panel">
    <div class="chat-widget-header">
        <span>💬 AI Chat</span>
        <button class="chat-widget-close" onclick="closeChatWidget()">&times;</button>
    </div>
    <div id="chatWidgetBox" class="chat-widget-box"></div>
    <div class="chat-widget-input">
        <input type="text" id="chatWidgetInput" placeholder="Ask a question...">
        <button onclick="sendChatWidgetMessage()">Send</button>
    </div>
</div>

<style>
    .chat-widget-panel {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 350px;
        max-width: calc(100vw - 40px);
        height: 450px;
        max-height: calc(100vh - 140px);
        background: rgba(26, 39, 53, 0.97);
        backdrop-filter: blur(20px);
        border-radius: 16px;
        border: 2px solid rgba(255, 180, 0, 0.3);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        display: none;
        flex-direction: column;
        z-index: 1500;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
    }

    .chat-widget-panel.open {
        display: flex;
    }

    .chat-widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        background: linear-gradient(135deg, #ff6a00, #ffb400);
        color: #fff;
        font-weight: 600;
    }

    .chat-widget-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
    }

    .chat-widget-box {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
    }

    .chat-widget-input {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid rgba(255, 180, 0, 0.2);
    }

    .chat-widget-input input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
    }

    .chat-widget-input button {
        background: linear-gradient(135deg, #ff6a00, #ffb400);
        border: none;
        color: #fff;
        padding: 0 16px;
        border-radius: 8px;
        cursor: pointer;
    }

    .chat-widget-user,
    .chat-widget-bot {
        margin: 8px 0;
        padding: 10px;
        border-radius: 8px;
        text-align: left;
        color: #fff;
        font-size: 0.9rem;
    }

    .chat-widget-user {
        background: rgba(255, 106, 0, 0.2);
    }

    .chat-widget-bot {
        background: rgba(255, 180, 0, 0.15);
    }

    .chat-widget-bot h1,
    .chat-widget-bot h2,
    .chat-widget-bot h3,
    .chat-widget-bot h4 {
        margin: 10px 0 6px;
    }

    .chat-widget-bot p {
        margin: 6px 0;
        line-height: 1.5;
    }

    .chat-widget-bot ul,
    .chat-widget-bot ol {
        margin: 6px 0;
        padding-left: 20px;
    }

    .chat-widget-bot li {
        margin: 3px 0;
    }

    .chat-widget-bot code {
        background: rgba(0, 0, 0, 0.4);
        padding: 2px 5px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
    }

    .chat-widget-bot pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        margin: 6px 0;
    }

    .chat-widget-bot pre code {
        background: none;
        padding: 0;
    }

    .chat-widget-bot table {
        border-collapse: collapse;
        margin: 6px 0;
        width: 100%;
    }

    .chat-widget-bot th,
    .chat-widget-bot td {
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 5px 8px;
        text-align: left;
    }

    @media (max-width: 480px) {
        .chat-widget-panel {
            right: 10px;
            left: 10px;
            width: auto;
            bottom: 90px;
        }
    }
</style>

<script>
    function openChatWidget() {
        document.getElementById('chatWidgetPanel').classList.add('open');
        document.getElementById('chatWidgetInput').focus();
    }

    function closeChatWidget() {
        document.getElementById('chatWidgetPanel').classList.remove('open');
    }

    function escapeChatWidgetHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendChatWidgetMessage() {
        const inputEl = document.getElementById('chatWidgetInput');
        const message = inputEl.value;
        if (!message.trim()) return;

        const box = document.getElementById('chatWidgetBox');
        box.innerHTML += `<div class="chat-widget-user"><b>You:</b> ${escapeChatWidgetHtml(message)}</div>`;
        inputEl.value = '';
        box.scrollTop = box.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await response.json();
            if (response.ok) {
                box.innerHTML += `<div class="chat-widget-bot"><b>Bot:</b> ${data.response}</div>`;
            } else {
                box.innerHTML += `<div class="chat-widget-bot"><b>Bot:</b> ${escapeChatWidgetHtml(data.error || "An error occurred!")}</div>`;
            }
        } catch (err) {
            box.innerHTML += `<div class="chat-widget-bot"><b>Bot:</b> Something went wrong. Please try again.</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('chatWidgetInput');
        if (input) {
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') sendChatWidgetMessage();
            });
        }
    });
</script>
